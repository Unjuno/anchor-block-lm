name: two-model-content-audit
on:
  push:
    branches: [two-model-result-audit]
    paths:
      - "experiments/two_model_rl/content_audit.py"
      - "experiments/two_model_rl/tests/test_content_audit.py"
      - ".github/workflows/two-model-content-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        seed: [48017, 48018, 48019]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 tokenizers==0.22.2 'pytest>=8'
      - name: All five experiment suites
        run: |
          (cd experiments/two_model_rl && PYTHONPATH=. pytest -q tests && python -m py_compile *.py)
          (cd experiments/adaptive_k_rl && PYTHONPATH=. pytest -q tests)
          (cd experiments/fixed_k_gate && PYTHONPATH=. pytest -q tests)
          (cd experiments/bpe_probe && PYTHONPATH=. pytest -q tests)
          (cd experiments/synthetic && PYTHONPATH=. pytest -q tests)
      - uses: actions/download-artifact@v4
        with:
          name: adaptive-k-rl-evidence
          run-id: 37324518978
          github-token: ${{ github.token }}
          path: saved-evidence
      - uses: actions/download-artifact@v4
        with:
          name: two-model-seed-${{ matrix.seed }}
          run-id: 37333971033
          github-token: ${{ github.token }}
          path: trained-evidence
      - name: Score saved content; no retraining
        run: python -u experiments/two_model_rl/content_audit.py --artifact-root saved-evidence --trained-root trained-evidence --out content-audit --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: two-model-content-audit-${{ matrix.seed }}
          path: |
            content-audit/content_fidelity.json
            content-audit/content_fidelity.npz
          if-no-files-found: error
