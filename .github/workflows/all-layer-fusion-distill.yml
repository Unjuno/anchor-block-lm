name: all-layer-fusion-distill

on:
  push:
    branches: [all-layer-fusion-distill]
    paths:
      - "experiments/layer_fusion_probe/**"
      - ".github/workflows/all-layer-fusion-distill.yml"
  workflow_dispatch:

concurrency:
  group: all-layer-fusion-distill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        seed: [48017, 48018, 48019]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    defaults:
      run:
        working-directory: experiments/layer_fusion_probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 tokenizers==0.22.2 "pytest>=8"
      - name: Verify fusion and data-integrity suites
        run: |
          PYTHONPATH=. pytest -q tests
          (cd ../bpe_probe && PYTHONPATH=. pytest -q tests)
          python -m py_compile *.py
      - uses: actions/download-artifact@v4
        with:
          name: adaptive-k-rl-evidence
          run-id: 37324518978
          github-token: ${{ github.token }}
          path: saved-evidence
      - name: Run paired distillation ablation
        run: |
          python -u run_architecture_experiment.py \
            --artifact-root saved-evidence \
            --out outputs/seed-${{ matrix.seed }} \
            --seed ${{ matrix.seed }} \
            --steps 600 \
            --train-contexts 1536 \
            --train-samples 4 \
            --dev-contexts 128 \
            --dev-samples 32 \
            --fusion-rank 8 \
            --fusion-hidden 64
      - uses: actions/upload-artifact@v4
        with:
          name: all-layer-fusion-seed-${{ matrix.seed }}
          path: |
            experiments/layer_fusion_probe/outputs/seed-${{ matrix.seed }}/result.json
            experiments/layer_fusion_probe/outputs/seed-${{ matrix.seed }}/dev_scores.npz
            experiments/layer_fusion_probe/outputs/seed-${{ matrix.seed }}/models.pt
