name: bpe-block-head-ablation

on:
  push:
    branches: [bpe-block-transformer-head]
    paths:
      - "experiments/bpe_probe/train_block_head_ablation.py"
      - "experiments/bpe_probe/tests/test_probe.py"
      - ".github/workflows/bpe-head-ablation.yml"
  workflow_dispatch:

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/bpe_probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - run: python -m py_compile train_block_head_ablation.py
      - run: python prepare_data.py
      - run: python train_teacher.py --steps 1000
      - run: python train_block_head_ablation.py prepare
      - run: python train_block_head_ablation.py train-independent --steps 800
      - run: python train_block_head_ablation.py train-transformer --steps 800
      - run: python train_block_head_ablation.py compare
      - run: cat results/head_ablation_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: bpe-block-head-ablation
          path: experiments/bpe_probe/results/*.json
