name: synthetic-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - run: pip install numpy==2.3.5 "pytest>=8"
      - run: PYTHONPATH=. pytest -q
      - run: python -m py_compile poc.py anchor_block_experiment.py eob_experiment.py onpolicy_eob_refresh.py train_teacher.py benchmark_onpolicy.py third_party/nanogpt/model.py
