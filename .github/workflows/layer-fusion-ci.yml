name: layer-fusion-ci

on:
  push:
    branches: [all-layer-fusion-distill]
    paths:
      - "experiments/layer_fusion_probe/**"
      - ".github/workflows/layer-fusion-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/layer_fusion_probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - run: python -m pip install numpy==2.3.5 "pytest>=8"
      - run: PYTHONPATH=. pytest -q tests
