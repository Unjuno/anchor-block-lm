name: bpe-ci

on:
  push:
    branches: [main, bpe-predictability-probe]
    paths:
      - "experiments/bpe_probe/**"
      - "experiments/synthetic/third_party/nanogpt/**"
      - ".github/workflows/bpe-ci.yml"
  pull_request:
    paths:
      - "experiments/bpe_probe/**"
      - "experiments/synthetic/third_party/nanogpt/**"
      - ".github/workflows/bpe-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/bpe_probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - run: python -m py_compile *.py
