name: dynamic-boundary-rl

on:
  push:
    branches: [dynamic-boundary-constrained-rl]
    paths:
      - "experiments/dynamic_boundary_rl/**"
      - ".github/workflows/dynamic-boundary-rl.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - run: python -m pip install numpy==2.3.5 tokenizers==0.22.2 "pytest>=8"
      - name: Full experiment stack tests
        run: |
          (cd experiments/dynamic_boundary_rl && PYTHONPATH=. pytest -q tests && python -m py_compile *.py)
          (cd experiments/two_model_rl && PYTHONPATH=. pytest -q tests)
          (cd experiments/adaptive_k_rl && PYTHONPATH=. pytest -q tests)
          (cd experiments/fixed_k_gate && PYTHONPATH=. pytest -q tests)
          (cd experiments/bpe_probe && PYTHONPATH=. pytest -q tests)
          (cd experiments/synthetic && PYTHONPATH=. pytest -q tests)

  experiment:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        seed: [48017, 48018, 48019]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - run: python -m pip install numpy==2.3.5 tokenizers==0.22.2
      - name: Download audited initial actor/evaluator evidence
        uses: actions/download-artifact@v4
        with:
          name: adaptive-k-rl-evidence
          run-id: 37324518978
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Unjuno/anchor-block-lm
          path: saved-evidence
      - name: Train dynamic boundary actor
        run: |
          python -u experiments/dynamic_boundary_rl/run_dynamic_experiment.py \
            --artifact-root saved-evidence \
            --out dynamic-output/seed-${{ matrix.seed }} \
            --seed ${{ matrix.seed }}
      - name: Preserve seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-boundary-seed-${{ matrix.seed }}
          path: dynamic-output/seed-${{ matrix.seed }}/
          if-no-files-found: error
